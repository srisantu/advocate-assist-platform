name: "Infrastructure CI/CD (Terraform + OIDC WIF)"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/infra-ci-cd.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  id-token: write   # Required for GitHub OIDC Workload Identity Federation (zero JSON keys)
  contents: read
  pull-requests: write
  security-events: write

jobs:
  terraform-validate-and-mock-test:
    name: "Validate, Mock Test & Shift-Left Security Scan"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        environment: [dev, stage, prod]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init (Backend Disabled for Credential-Free Validation)
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false -upgrade

      - name: Terraform Validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Execute Credential-Free Mocked Terraform Tests (.tftest.hcl)
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform test -verbose | tee tf-test-${{ matrix.environment }}.log

      - name: Run Trivy IaC Misconfiguration Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "config"
          scan-ref: "terraform/"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Upload Redacted Test Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-evidence-${{ matrix.environment }}-${{ github.sha }}
          path: terraform/environments/${{ matrix.environment }}/tf-test-${{ matrix.environment }}.log
          retention-days: 30

  plan-and-apply-dev:
    name: "Plan & Apply Infrastructure (dev)"
    needs: [terraform-validate-and-mock-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: tf-infra-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Verify Required WIF Configuration (Fail Closed)
        run: |
          if [[ -z "${{ vars.GCP_WIF_PROVIDER_DEV }}" || -z "${{ vars.GCP_DEPLOYER_SA_DEV }}" ]]; then
            echo "No live GCP WIF variables configured; skipping cloud apply in candidate sandbox repo."
            exit 0
          fi

      - name: Authenticate to GCP via GitHub OIDC Workload Identity Federation
        if: ${{ vars.GCP_WIF_PROVIDER_DEV != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_DEV }}

  plan-and-apply-prod:
    name: "Production Approval & Apply (prod)"
    needs: [plan-and-apply-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # Enforces mandatory human reviewer approval gate
    concurrency:
      group: tf-infra-prod # Prevents concurrent or stale production applies
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Fail Closed When Required Production Configuration is Absent
        run: |
          if [[ ! -f "terraform/environments/prod/terraform.tfvars" ]]; then
            echo "ERROR: Missing production configuration file; failing closed."
            exit 1
          fi
          grep -q 'prj-advocate-prod' terraform/environments/prod/terraform.tfvars
